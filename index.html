<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>TIMSTER</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--panel:#17171a;--line:#2a2a2f;--fg:#f4f1ea;--dim:#8d8d96;--gelb:#b6ff3c;--pink:#ff3d81}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 30px) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));overflow-y:auto}
.logo{margin:6px auto 0;width:min(100%,340px);text-align:center}
.logo h1{margin:0;font-family:Comfortaa,'Varela Round',system-ui,sans-serif;font-weight:700;font-size:clamp(36px,min(13.5vw,7.4dvh),60px);line-height:1;letter-spacing:.04em;color:transparent;-webkit-text-stroke:2px #eaffd0;
 text-shadow:0 0 6px #b6ff3c,0 0 16px #6ee00a,0 0 34px #4cc400}
.logo p{margin:10px 0 0;color:#fff;font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase}
.tl{position:relative;height:22px;margin:min(14px,1.6dvh) 6px 0;filter:drop-shadow(0 0 5px #6ee00a)}
.tl::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#b6ff3c;border-radius:2px}
.tl::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:9px;background:repeating-linear-gradient(90deg,#b6ff3c 0 2px,transparent 2px 10px)}
.tl b{position:absolute;bottom:3px;width:3px;height:20px;background:#b6ff3c}
.tl b:first-child{left:0}.tl b:last-child{right:0}
.yrs{display:flex;justify-content:space-between;margin:4px 6px 0;color:#c9ff7a;font-size:13px;letter-spacing:.14em;text-shadow:0 0 8px #6ee00a;font-variant-numeric:tabular-nums}
main{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;min-height:0;padding-block:28px 14px}
[hidden]{display:none!important}
.screen{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{width:100%;height:var(--stage-h,300px);display:flex;flex-direction:column;align-items:center;gap:12px}
.vwrap{flex:1;min-height:0;width:100%;padding-bottom:14px;display:flex;align-items:center;justify-content:center}
#s-start .vinyl,#s-setup .vinyl{width:min(64vw,250px,30dvh)}
button{font:inherit;border:0;cursor:pointer;color:var(--fg)}
.big{width:100%;padding:18px;border-radius:14px;background:var(--gelb);color:#0a1a00;font-weight:800;font-size:18px;letter-spacing:.04em}
.big:active{transform:scale(.98)}
.ghost{background:var(--panel);border:1px solid var(--line);padding:13px 16px;border-radius:12px;font-size:15px;width:100%}
.row{display:flex;gap:10px;width:100%}
a.ghost{display:block;text-align:center;text-decoration:none;color:var(--fg)}.row>*{flex:1}
.vinyl{width:min(60vw,250px);aspect-ratio:1;border-radius:50%;background:
 radial-gradient(circle,var(--gelb) 0 17%,#111 17.5% 19%,transparent 19.5%),
 repeating-radial-gradient(circle,#161618 0 2px,#0c0c0d 2px 4px);border:2px solid #222;position:relative;box-shadow:0 10px 40px #000a}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,#fff0,#fff2 8%,#fff0 20%,#fff0 50%,#fff2 58%,#fff0 70%)}
.vinyl.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.vinyl.spin{animation:none}}
#cam{position:relative;width:100%;aspect-ratio:3/4;max-height:58vh;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
#cam video{width:100%;height:100%;object-fit:cover}
#cam .frame{position:absolute;inset:18% 14%;border:3px solid var(--gelb);border-radius:22px;box-shadow:0 0 0 999px #0008}
#msg{color:var(--dim);font-size:14px;text-align:center;min-height:20px;line-height:1.4}
#msg.err{color:var(--pink)}
.barwrap{width:100%;padding:12px 0;touch-action:none;cursor:pointer}
.bar{width:100%;height:8px;background:var(--panel);border-radius:4px;position:relative}
.bar i{display:block;height:100%;width:0;background:var(--gelb);border-radius:4px}
.bar b{position:absolute;top:50%;left:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--fg);box-shadow:0 1px 6px #000a}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;display:flex;justify-content:space-between;align-items:center;width:100%}
.prog{width:100%;margin-top:-2px}
.prog .barwrap{padding:18px 0;margin:-10px 0}
.hint{font-size:13px;color:var(--dim);text-align:center;line-height:1.5}
.tag{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.tag.ok{color:var(--gelb)}.tag.warn{color:var(--pink)}
#msg3.err{color:var(--pink)}#msg3.info{color:var(--fg)}
.big.wake{background:var(--fg);color:#0b0b0c}
#b-reveal{position:relative;isolation:isolate;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;padding:8px 12px;line-height:1.15}
#b-reveal small{display:block;font-size:10px;letter-spacing:.08em;color:var(--dim);margin-top:2px}
#b-reveal::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--gelb);opacity:.28;transform:scaleX(0);transform-origin:left}
#b-reveal.hold::before{transform:scaleX(1);transition:transform .6s linear}
.row .ghost{min-height:48px}
#reveal{width:100%;max-height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#reveal img{width:min(34vw,128px,13dvh);aspect-ratio:1;border-radius:10px;object-fit:cover;box-shadow:0 6px 24px #000a}
#reveal .yr{order:-1;font-size:min(14vw,50px);font-weight:800;color:var(--gelb);font-variant-numeric:tabular-nums;text-shadow:0 0 14px #6ee00a99;line-height:1}
#reveal .yr small{display:block;font-size:10px;font-weight:500;color:var(--dim);letter-spacing:.08em;margin-top:4px;text-shadow:none}
#reveal .tx{width:100%;min-width:0}
#reveal b{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-size:clamp(15px,4.6vw,18px);line-height:1.2}
#reveal .tx span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;color:var(--dim);font-size:clamp(12px,3.6vw,14px);line-height:1.25;margin-top:3px}
#s-play.rev #vinyl{display:none}
a{color:var(--gelb)}
</style>
</head>
<body>
<header><div class="logo"><h1>TIMSTER</h1><p>Die Deutschrap Edition</p><div class="tl"><b></b><b></b></div><div class="yrs"><span>1995</span><span>2026</span></div></div></header>
<main>

<section class="screen" id="s-setup" hidden>
  <div class="stage"><div class="vwrap"><div class="vinyl"></div></div></div>
  <button class="big" id="b-login">MIT SPOTIFY VERBINDEN</button>
  <div class="hint">Einmal pro Handy. Du brauchst Spotify Premium.</div>
</section>

<section class="screen" id="s-start" hidden>
  <div class="stage"><div class="vwrap"><div class="vinyl"></div></div></div>
  <button class="big" id="b-scan">KARTE SCANNEN</button>
  <button class="ghost mbtn" id="b-music2" hidden>❚❚ Musik aus</button>
  <div id="msg"></div>
  <button class="ghost" id="b-logout" style="background:none;border:0;color:var(--dim);font-size:12px">Spotify-Verbindung trennen</button>
</section>

<section class="screen" id="s-cam" hidden>
  <div id="cam"><video id="v" playsinline muted></video><div class="frame"></div></div>
  <div id="msg2" class="hint">QR-Code in den Rahmen halten</div>
  <div class="row"><button class="ghost" id="b-cancel">Abbrechen</button><button class="ghost mbtn" id="b-music" hidden>❚❚ Musik aus</button></div>
</section>

<section class="screen" id="s-play" hidden>
  <div class="stage">
  <div class="vwrap"><div class="vinyl spin" id="vinyl"></div><div id="reveal" hidden><div class="yr"><div id="r-year"></div><small id="r-ysrc"></small></div><img id="r-img" alt=""><div class="tx"><b id="r-title"></b><span id="r-artist"></span></div></div></div>
  </div>
  <button class="big" id="b-toggle">❚❚ PAUSE</button>
  <div class="row">
    <button class="ghost" id="b-reveal">Auflösen<small>gedrückt halten</small></button>
    <button class="ghost" id="b-next">Nächste Karte</button>
  </div>
  <div class="prog">
    <div class="barwrap" id="barwrap"><div class="bar"><i id="prog"></i><b id="knob"></b></div></div>
    <div class="time"><span id="tpos">0:00</span><span class="tag" id="status">Lädt …</span><span id="tdur">0:00</span></div>
  </div>
    <div id="msg3" class="hint"></div>
  <div class="row" id="errbtns" hidden><button class="ghost" id="b-retry">Nochmal</button></div>
</section>

</main>
<label id="hapt" aria-hidden="true" style="position:fixed;left:-99px;top:0;width:1px;height:1px;overflow:hidden;opacity:0"><input type="checkbox" switch tabindex="-1"></label>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function(){
'use strict';
/* Zoomen verhindern: Safari ignoriert user-scalable=no, daher Gesten direkt abfangen */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
let lastTouch=0;
document.addEventListener('touchend',function(e){const n=Date.now();if(n-lastTouch<300)e.preventDefault();lastTouch=n;},{passive:false});
const $=id=>document.getElementById(id);
const screens={setup:$('s-setup'),start:$('s-start'),cam:$('s-cam'),play:$('s-play')};
function show(n){for(const k in screens)screens[k].hidden=k!==n;}
function say(t,err){const m=$('msg');m.textContent=t||'';m.className=err?'err':'';}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const REDIRECT=location.origin+location.pathname;
const SCOPES='user-modify-playback-state user-read-playback-state';

/* ---------- Spotify-Login (PKCE) ---------- */
function rnd(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[b%66]).join('');}
function b64u(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
const CID='e6db0311807c477a95e3df4dcdd3e79a';
async function login(){
  const ver=rnd(96);ls('zs_ver',ver);
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:CID,scope:SCOPES,redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch});
}
function alert_(t){const m=$('msg');m.textContent=t;m.className='err';if(screens.setup.hidden===false){let e=$('seterr');if(!e){e=document.createElement('div');e.id='seterr';e.className='hint';e.style.color='var(--pink)';screens.setup.appendChild(e);}e.textContent=t;}}
/* Fehlerarten: REVOKED = Spotify lehnt den Schlüssel ab (neu einloggen), NETWORK = vorübergehend (behalten, später nochmal) */
async function tokenCall(body){
  let r,j={};
  try{r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});}
  catch(e){throw new Error('NETWORK');}
  try{j=await r.json();}catch(e){}
  if(!r.ok){if(j.error==='invalid_grant'||j.error==='invalid_client'||r.status===400)throw new Error('REVOKED');throw new Error('NETWORK');}
  const old=JSON.parse(ls('zs_tok')||'{}');
  ls('zs_tok',JSON.stringify({access:j.access_token,refresh:j.refresh_token||old.refresh,exp:Date.now()+j.expires_in*1000}));
}
async function handleRedirect(){
  const p=new URLSearchParams(location.search);
  if(p.get('error')){history.replaceState({},'',REDIRECT);show('setup');alert_('Login abgebrochen: '+p.get('error'));return true;}
  const code=p.get('code');if(!code)return false;
  history.replaceState({},'',REDIRECT);
  try{await tokenCall({grant_type:'authorization_code',code,redirect_uri:REDIRECT,client_id:CID,code_verifier:ls('zs_ver')});ls('zs_ver',null);}
  catch(e){show('setup');alert_(e.message==='NETWORK'?'Keine Verbindung zu Spotify. Prüfe dein Internet und versuche es nochmal.':'Login fehlgeschlagen. Bitte nochmal verbinden.');return true;}
  return false;
}
let refreshing=null; /* läuft gerade eine Erneuerung? Dann warten alle auf dieselbe */
async function token(){
  let t=JSON.parse(ls('zs_tok')||'null');if(!t)throw new Error('NOLOGIN');
  if(t.exp<Date.now()+60000){
    if(!refreshing)refreshing=tokenCall({grant_type:'refresh_token',refresh_token:t.refresh,client_id:CID}).finally(function(){refreshing=null;});
    try{await refreshing;}
    catch(e){if(e.message==='REVOKED'){ls('zs_tok',null);throw new Error('NOLOGIN');}throw e;}
    t=JSON.parse(ls('zs_tok'));
  }
  return t.access;
}
async function api(method,path,body){
  const t=await token();
  try{return await fetch('https://api.spotify.com/v1'+path,{method,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});}
  catch(e){throw new Error('NETWORK');}
}
function needLogin(){show('setup');}

/* ---------- Wiedergabe ---------- */
let current=null,poll=0,lastItem=null,gotState=false,dur=0,pos=0,dragging=false,isPlaying=false,mode='pause',wake=false,woke=null,silent=false,silTimer=0,repeatOn=false,resumeAt=0;
/* Stille-Tracks: halten Spotify im Hintergrund wach, statt zu pausieren */
const SILENCE=['6gWSdJ0JS8hPUrKDUrgEwj','0vqOexC3BQ4wpFREmBoQqm'];
function haptic(){try{$('hapt').click();}catch(e){}}
function parseTrack(text){
  if(!text)return null;
  let m=String(text).match(/open\.spotify\.com\/(?:intl-[a-z]+\/)?(?:embed\/)?track\/([A-Za-z0-9]{22})/);
  if(m)return m[1];
  m=String(text).match(/spotify:track:([A-Za-z0-9]{22})/);return m?m[1]:null;
}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function pmsg(t,kind){const m=$('msg3');m.textContent=t||'';m.className='hint'+(kind?' '+kind:'');}
function status(t,k){const s=$('status');s.textContent=t;s.className='tag'+(k?' '+k:'');}
/* Hauptknopf: pause | play | wake */
function setMain(m){mode=m;const b=$('b-toggle');b.classList.toggle('wake',m==='wake');b.textContent=m==='wake'?'SPOTIFY WECKEN':m==='pause'?'❚❚ PAUSE':'▶ WEITER';}
function setMusic(){document.querySelectorAll('.mbtn').forEach(function(b){b.hidden=!current||!gotState;b.textContent=isPlaying?'❚❚ Musik aus':'▶ Musik an';});}
function goWake(){wake=true;location.href='spotify:';}
async function getDevices(){
  try{const r=await api('GET','/me/player/devices');const d=await r.json();return d.devices||[];}catch(e){return [];}
}
async function startTrack(id,startMs){
  const uris=['spotify:track:'+id],body={uris};if(startMs>0)body.position_ms=Math.round(startMs);
  let dev=null,last=0;
  for(let attempt=0;attempt<4;attempt++){
    const r=await api('PUT','/me/player/play'+(dev?'?device_id='+dev:''),body);
    last=r.status;
    if(r.ok||r.status===204)return;
    if(r.status===403)throw new Error('PREMIUM');
    if(r.status===401)throw new Error('NOLOGIN');
    if(r.status!==404)throw new Error('HTTP '+r.status);
    /* 404: kein aktives Gerät, Gerät schläft oder ist nicht erreichbar */
    const list=await getDevices();
    const pick=list.find(x=>x.is_active)||list.find(x=>/smartphone/i.test(x.type))||list[0];
    if(!pick)throw new Error('NODEVICE');
    dev=pick.id;
    try{await api('PUT','/me/player',{device_ids:[dev],play:false});}catch(e){}
    await sleep(900+attempt*700);
  }
  throw new Error('DEVICE404');
}
async function playTrack(id,startMs,keep){
  stopCam();clearInterval(poll);clearTimeout(silTimer);
  startMs=startMs||0;resumeAt=startMs;
  if(!keep||current!==id){current=id;lastItem=null;setReveal(false);setBar(0);dur=0;$('tpos').textContent='0:00';$('tdur').textContent='0:00';}
  gotState=false;wake=false;isPlaying=false;silent=false;pos=startMs;
  setMain('pause');status('Startet …');$('vinyl').classList.add('spin');
  pmsg('');$('errbtns').hidden=true;
  show('play');
  try{await startTrack(id,startMs);if(repeatOn){repeatOn=false;api('PUT','/me/player/repeat?state=off').catch(function(){});}}
  catch(e){
    $('vinyl').classList.remove('spin');
    if(e.message==='NOLOGIN'){needLogin();return;}
    if(e.message==='NODEVICE'||e.message==='DEVICE404'){diagnose(id);return;}
    status('Fehler','warn');setMain('play');$('errbtns').hidden=false;
    if(e.message==='NETWORK')pmsg('Keine Verbindung zu Spotify. Prüfe dein Internet und tippe „Nochmal“.','err');
    else if(e.message==='PREMIUM')pmsg('Spotify meldet: Premium nötig, oder die App ist nicht für dein Konto freigeschaltet (Dashboard → User Management).','err');
    else pmsg('Konnte nicht starten ('+e.message+').','err');
    return;
  }
  poll=setInterval(refresh,1000);refresh();
  setTimeout(function(){if(current===id&&!gotState)diagnose(id);},4500);
}
/* Spotify schläft im Hintergrund: einmal automatisch hinspringen, sonst Hauptknopf „SPOTIFY WECKEN“ */
function diagnose(id){
  clearInterval(poll);
  wake=true;$('vinyl').classList.remove('spin');setMain('wake');status('Spotify schläft','warn');
  const manual='Tippe auf „Spotify wecken“ und wechsle danach zurück zu Safari. Der Song startet dann von selbst.';
  if(woke!==id){
    woke=id;
    pmsg('Spotify wird geweckt. Wechsle danach zurück zu Safari, der Song startet dann von selbst.','info');
    setTimeout(function(){
      if(current!==id||gotState)return;
      location.href='spotify:';
      /* Seite nach 2 s noch sichtbar = Safari hat den Sprung blockiert */
      setTimeout(function(){if(document.visibilityState==='visible'&&current===id&&!gotState)pmsg(manual,'info');},2000);
    },500);
    return;
  }
  pmsg(manual,'info');$('errbtns').hidden=false;
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&wake&&current&&!gotState&&!screens.play.hidden){wake=false;setTimeout(function(){playTrack(current,resumeAt,true);},600);}
});
async function refresh(){
  let r;
  try{r=await api('GET','/me/player');}
  catch(e){if(e.message==='NOLOGIN'){clearInterval(poll);needLogin();}else if(gotState)status('Keine Verbindung …','warn');return;}
  if(silent)return;                                   /* Stille läuft: Zustand hält die App selbst */
  if(r.status!==200)return;
  let s;try{s=await r.json();}catch(e){return;}
  const mine=s.item&&(s.item.id===current||(s.item.linked_from&&s.item.linked_from.id===current));
  if(!mine){
    /* Unser Song ist vorbei und Spotify spielt etwas anderes (Autoplay) oder nichts: auf Stille umschalten */
    if(gotState&&!silent&&pos>=dur-15000)enterSilence(dur,true);
    return;
  }
  if(!gotState){woke=null;pmsg('');$('errbtns').hidden=true;}
  lastItem=s.item;gotState=true;wake=false;isPlaying=!!s.is_playing;
  dur=s.item.duration_ms;pos=s.progress_ms||0;
  if(!isPlaying&&pos>=dur-1500){enterSilence(dur,true);return;}
  if(!dragging){setBar(pos/dur);$('tpos').textContent=fmt(pos);}
  $('tdur').textContent=fmt(dur);
  setMain(isPlaying?'pause':'play');
  $('vinyl').classList.toggle('spin',isPlaying);
  if(isPlaying)status('Läuft','ok');else status('Pausiert');
  if(!$('reveal').hidden)fillReveal();
  setMusic();
}
/* „Pause“ = stummer Track in Dauerschleife. Spotify spielt weiter und bleibt wach. */
async function enterSilence(at,ended){
  silent=true;isPlaying=false;resumeAt=ended?0:at;pos=at;
  setMain('play');$('vinyl').classList.remove('spin');status(ended?'Zu Ende':'Pausiert');setMusic();
  if(dur){setBar(at/dur);$('tpos').textContent=fmt(at);}
  let ok=false;
  for(const sid of SILENCE){
    try{const r=await api('PUT','/me/player/play',{uris:['spotify:track:'+sid]});if(r.ok){ok=true;break;}}catch(e){break;}
  }
  if(ok){repeatOn=true;api('PUT','/me/player/repeat?state=track').catch(function(){});}
  else{try{await api('PUT','/me/player/pause');}catch(e){}}
  /* Nach 20 Minuten Pause ist das Spiel wohl vorbei: richtig pausieren, um Akku zu sparen */
  clearTimeout(silTimer);
  silTimer=setTimeout(async function(){
    if(!silent)return;
    try{await api('PUT','/me/player/pause');if(repeatOn){repeatOn=false;await api('PUT','/me/player/repeat?state=off');}}catch(e){}

/* ---------- Kamera-Scan ---------- */
let stream=null,raf=0,detector=null,canvas=document.createElement('canvas'),cx=canvas.getContext('2d',{willReadFrequently:true}),lastTry=0;
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){show('start');setMusic();say('Kamera nicht verfügbar. Öffne die Seite in Safari.',true);return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});}
  catch(e){show('start');setMusic();say('Kamerazugriff verweigert. Erlaube die Kamera in den Safari-Einstellungen für diese Seite.',true);return;}
  const v=$('v');v.srcObject=stream;await v.play().catch(function(){});
  if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['qr_code']});}catch(e){detector=null;}}
  show('cam');setMusic();$('msg2').textContent='QR-Code in den Rahmen halten';loop();
}
function stopCam(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
async function loop(){
  const v=$('v');if(!stream)return;
  const now=performance.now();
  if(v.readyState>=2&&now-lastTry>120){
    lastTry=now;let text=null;
    try{
      if(detector){const r=await detector.detect(v);if(r.length)text=r[0].rawValue;}
      else{
        const w=v.videoWidth,h=v.videoHeight,sc=Math.min(1,640/Math.max(w,h));
        canvas.width=Math.round(w*sc);canvas.height=Math.round(h*sc);cx.drawImage(v,0,0,canvas.width,canvas.height);
        const im=cx.getImageData(0,0,canvas.width,canvas.height);
        const q=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});if(q)text=q.data;
      }
    }catch(e){}
    if(text){const id=parseTrack(text);if(id){playTrack(id);return;}$('msg2').textContent='Das ist keine Song-Karte.';}
  }
  raf=requestAnimationFrame(loop);
}

function layout(){
  const probe=document.querySelector('.screen:not([hidden]) .stage')||document.querySelector('.stage');
  if(!probe)return;
  const prev=probe.style.height;probe.style.height='0px';
  const top=probe.getBoundingClientRect().top+window.scrollY;
  probe.style.height=prev;
  const h=Math.max(240,Math.round(window.innerHeight*0.72-43-top));
  document.documentElement.style.setProperty('--stage-h',h+'px');
}
